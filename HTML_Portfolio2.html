<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HTML/CSS入門編2: CSSの基礎を学ぼう</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flat-ui/2.3.0/css/flat-ui.min.css">
    
    <style>
        /* 共通のスタイル */
        body {
            padding: 30px;
        }

        /* Chapterごとのスタイル */
        .chapter1 {
            background-color: lightgray;
        }

        .chapter2 {
            background-color: #ff8800;
            color: white;
        }

        .chapter2-2 {
            background-color: #D3D3D3;
            color: white;
        }

        .chapter3 {
            padding: 30px;
            color: #008080;
            font-weight: bold;
            font-size: 120%;
            font-family: serif;
        }

        .chapter3-2 h1 {
            font-size: 400%;
            font-family: serif;
        }

        .chapter4 p {
            border: dotted #008080;
            margin: 30px;
        }

        .chapter4-2 h1 {
            border: solid #00A0A0;
            margin: 80px;
        }
    </style>
</head>
<body>

    <!-- 01: CSSの基本形を理解しよう -->
    <section class="chapter1">
        <h1>吾輩は猫である。</h1>
        <p class="lead">名前はまだない。</p>
        <a class="btn btn-primary" href="#">OK</a>
    </section>

    <!-- 02: CSSの色指定を理解しよう -->
    <section class="chapter2">
        <h1>吾輩は猫である。</h1>
        <p class="lead">名前はまだない。</p>
        <a class="btn btn-primary" href="#">OK</a>
    </section>

    <section class="chapter2-2">
        <h1>hello paiza</h1> 
        <p>hello html</p>    
    </section>

    <!-- 03: CSSのフォント指定を理解しよう -->
    <section class="chapter3">
        <h1>吾輩は猫である。</h1>
        <p class="lead">名前はまだない。</p>
        <p>どこで生れたかとんと見当がつかぬ。何でも薄暗いじめじめした所でニャーニャー泣いていた事だけは記憶している。</p>
        <a class="btn btn-primary" href="#">OK</a>
    </section>

    <section class="chapter3-2">
        <h1>hello paiza</h1>
        <p>世界の皆さん、こんにちは</p>
    </section>

    <!-- 04: CSSのレイアウト指定を理解しよう -->
    <section class="chapter4">
        <h1>吾輩は猫である。</h1>
        <p class="lead">名前はまだない。</p>
        <p>どこで生れたかとんと見当がつかぬ。何でも薄暗いじめじめした所でニャーニャー泣いていた事だけは記憶している。</p>
        <a class="btn btn-primary" href="#">OK</a>
    </section>

    <section class="chapter4-2">
        <h1>hello paiza</h1>
        <p>世界の皆さん、こんにちは</p>
    </section>

    <!-- Scripts for Bootstrap -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/js/bootstrap.min.js"></script>
</body>
</html>
